# fmfpereira debian server playbook.

# Set dynamic host
- hosts: localhost
  gather_facts: no
  vars_prompt:
    - name: target_host
      prompt: Please enter the target host/IP
      private: no
  tasks:
    - add_host:
        name: "{{ target_host }}"
        groups: dynamically_created_hosts

# debian server playbook
- name: Setup a new debian server
  # Which hosts are we applying
  hosts: dynamically_created_hosts
  # Which roles are we installing
  roles:
    - debian-server-role
  vars_prompt:
    - name: user_name
      prompt: What is the username of the user to be created?
      private: no
      default: '{{ user_name }}'
    - name: user_password
      prompt: What is the password of the user to be created? (empty for key-only login)
      private: yes
      confirm: true
    - name: postfix_relay_host
      prompt: What is the postfix relay host?
      private: no
      default: '{{ postfix_relay_host }}'
    - name: postfix_relay_port
      prompt: What is the postfix relay port?
      private: no
      default: '{{ postfix_relay_port }}'
    - name: postfix_relay_mail
      prompt: What is the postfix relay email?
      private: no
      default: '{{ postfix_relay_mail }}'
    - name: postfix_relay_username
      prompt: What is the postfix relay username?
      private: no
      default: '{{ postfix_relay_username }}'
    - name: postfix_relay_password
      prompt: What is the postfix relay password?
      private: yes
      confirm: true
    - name: unattended_upgrades_email
      prompt: What is the email to send unattended upgrades notifications?
      private: no
      default: '{{ unattended_upgrades_email }}'