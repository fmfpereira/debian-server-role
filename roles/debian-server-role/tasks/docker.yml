# debian server docker setup.

- name: Install docker
  ansible.builtin.apt:
    name:
      - docker
      - docker-compose
    state: present
  become: yes

- name: Add current user to the docker group
  ansible.builtin.user:
    name: "{{ user.name }}"
    groups: docker
    append: yes
  become: yes

- name: Restart docker service
  ansible.builtin.service:
    name: docker
    state: restarted
  become: yes