# debian server iptables setup.

# Source: https://blog.ssdnodes.com/blog/tutorial-a-more-secure-ansible-playbook-part-2/

- name: Add firewall rule - allow all loopback traffic
  ansible.builtin.iptables:
    action: append
    chain: INPUT
    in_interface: lo
    jump: ACCEPT
  become: yes

- name: Add firewall rule - allow established connections
  ansible.builtin.iptables:
    chain: INPUT
    ctstate: ESTABLISHED,RELATED
    jump: ACCEPT
  become: yes

- name: Add firewall rule - allow port 22/SSH traffic
  ansible.builtin.iptables:
    chain: INPUT
    destination_port: "22"
    jump: ACCEPT
    protocol: tcp
  become: yes

- name: Add firewall rule - drop any traffic without rule
  ansible.builtin.iptables:
    chain: INPUT
    jump: DROP
  become: yes

- name: Install `netfilter-persistent` && `iptables-persistent` packages
  ansible.builtin.apt:
    name:
      - iptables-persistent
      - netfilter-persistent
  become: yes
  notify: Restart netfilter-persistent service