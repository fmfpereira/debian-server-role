# debian server fail2ban setup.

- name: Install fail2ban
  ansible.builtin.apt:
    name:
      - fail2ban
      - python3-systemd
  become: yes

# Check https://groups.google.com/g/linux.debian.bugs.dist/c/6ag6r1jSCqg
- name: Fix wrong configuration for journalmatch on the sshd filter file
  ansible.builtin.replace:
    path: /etc/fail2ban/filter.d/sshd.conf
    regexp: 'sshd.service'
    replace: 'ssh.service'
  become: yes

- name: Copy fail2ban ssh configuration template
  ansible.builtin.template:
    src: fail2ban.sshd.conf.j2
    dest: '/etc/fail2ban/jail.d/sshd.conf'
  become: yes
  notify:
  - Restart fail2ban service
