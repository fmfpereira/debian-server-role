# debian server update/upgrade setup.

- name: Full system upgrade
  ansible.builtin.apt:
    update_cache: yes
    upgrade: full
  become: yes

- name: Remove orphaned packages
  ansible.builtin.apt:
    autoremove: yes
  become: yes

- name: Install rsync
  ansible.builtin.apt:
    name: rsync
  become: yes
  
- name: Install sudo
  ansible.builtin.apt:
    name: sudo
  become: yes

# A task, not a handler: images that ship sudo (Hetzner, most clouds) never
# trigger the install, and the %sudo group must still be passwordless.
- name: Enable passwordless sudo for the sudo group
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    state: present
    regexp: '^%sudo'
    line: '%sudo ALL=(ALL) NOPASSWD: ALL'
    validate: 'visudo -cf %s'
  become: yes