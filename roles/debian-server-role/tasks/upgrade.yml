# debian server update/upgrade setup.

- name: Full system upgrade
  ansible.builtin.apt:
    update_cache: yes
    upgrade: full
  become: yes

- name: Remove orphaned packages
  ansible.builtin.apt:
    autoremove: yes
  become: yes

- name: Install rsync
  ansible.builtin.apt:
    name: rsync
  become: yes
  
- name: Install sudo
  ansible.builtin.apt:
    name: sudo
  become: yes
  notify:
    - Enable passwordless sudo