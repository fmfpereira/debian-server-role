# debian server default user setup.

- name: Create {{ user_name }} user
  ansible.builtin.user:
    name: '{{ user_name }}'
    password: "{{ user_password|password_hash('sha512') }}"
    groups: docker
    state: present
    shell: '/bin/bash'
  no_log: true
  become: yes
