# debian server default user setup.

- name: Create {{ user_name }} user
  ansible.builtin.user:
    name: '{{ user_name }}'
    password: "{{ (user_password | password_hash('sha512')) if user_password else omit }}"
    groups:
      - sudo
      - docker
    append: yes
    state: present
    shell: '/bin/bash'
  no_log: true
  become: yes

- name: Set the authorized SSH keys of {{ user_name }}
  ansible.posix.authorized_key:
    user: '{{ user_name }}'
    key: "{{ user_ssh_authorized_keys | join('\n') }}"
    exclusive: yes
  become: yes
  when: user_ssh_authorized_keys | length > 0
