# debian server setup vars.

# Default user.
user:
  name: 'ds'

# fail2ban variables.
fail2ban:
  ssh:
    bantime: 3600
    max_retries: 3

# postfix variables.
postfix:
  fqdn: localhost
  relay:
    mail: user@example.com
    host: smtp.gmail.com
    port: 587
    username: user@example.com
    password: password

# unattended upgrades variables.
unattended_upgrades:
  email: user@example.com